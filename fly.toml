# fly.toml app configuration file generated for airflow-i6nkzw on 2026-07-18T11:31:11Z
#
# See https://fly.io/docs/reference/configuration/ for information about how to use this file.
#

app = 'airflow-i6nkzw'
primary_region = 'cdg'

[build]
  dockerfile = 'Dockerfile'

[env]
  AIRFLOW_HOME = '/opt/airflow'

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = 'off'
  auto_start_machines = true
  min_machines_running = 1

  [http_service.concurrency]
    type = 'connections'
    hard_limit = 25
    soft_limit = 20

[checks]
  [checks.health]
    port = 8080
    type = 'tcp'
    interval = '2m0s'
    timeout = '30s'
    grace_period = '10m0s'

[[vm]]
  size = 'shared-cpu-1x'
  memory = '512'
