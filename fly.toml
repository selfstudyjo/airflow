app = "airflow-i6nkzw"
primary_region = "sjc"

[build]
  dockerfile = "Dockerfile"

[env]
  AIRFLOW_HOME = "/opt/airflow"

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = false
  auto_start_machines = true
  min_machines_running = 1

  [http_service.concurrency]
    type = "connections"
    hard_limit = 25
    soft_limit = 20

[checks]
  [checks.health]
    port = 8080
    type = "tcp"
    interval = "120s"
    timeout = "30s"
    grace_period = "600s"

[[vm]]
  size = "shared-cpu-1x"
  memory = 512